<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MVP 주간 숙제표 제작기</title>
  <style>
    :root{--sky:#69bdea;--pale:#eef8fd;--ink:#24364b;--line:#d5e6ef;--yellow:#ffd54a;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:#f2f8fb;color:var(--ink);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
    .top{padding:28px 32px 22px;background:#fff;border-bottom:1px solid var(--line)}.top-inner{max-width:1500px;margin:auto;display:flex;align-items:end;justify-content:space-between;gap:20px}.brand small{color:#3f94bc;font-size:11px;font-weight:900;letter-spacing:.18em}.brand h1{margin:5px 0 0;font-size:30px;letter-spacing:-.04em}.utility{display:flex;gap:7px;flex-wrap:wrap}.utility button,.ghost{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 12px;font-size:12px;font-weight:800}
    .toolbar{max-width:1500px;margin:20px auto 0;padding:15px 18px;background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;align-items:end;gap:10px}.toolbar label,.head-inputs label{display:grid;gap:5px;color:#587487;font-size:10px;font-weight:900}.toolbar select,.toolbar input,.head-inputs input{height:38px;padding:0 11px;border:1px solid #c9dce6;border-radius:8px;background:#fff}.toolbar label:first-child{min-width:290px}.toolbar button{height:38px;padding:0 14px;border:0;border-radius:8px;background:#e4f4fb;font-size:12px;font-weight:900}.toolbar .manage{background:var(--ink);color:#fff}.status{margin-left:auto;padding:7px 10px;border-radius:999px;background:#edf2f5;color:#6c7f8a;font-size:10px;font-weight:900}
    .workspace{max-width:1500px;margin:18px auto 40px;display:grid;grid-template-columns:minmax(650px,1.08fr) minmax(460px,.92fr);gap:18px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.head-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.head-inputs input{width:100%}.labels,.day-row{display:grid;grid-template-columns:60px 1.5fr 1fr 1fr;gap:7px}.labels{padding:0 6px 6px;color:#718895;font-size:10px;font-weight:900}.rows{display:grid;gap:6px}.day-row textarea{height:62px;padding:9px;border:1px solid #cddfe8;border-radius:8px;resize:vertical;font-size:12px}.day{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;background:var(--sky);font-weight:900}.day.weekend{background:var(--yellow)}.day b{font-size:17px}.day small{margin-top:3px;font-size:9px}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px;flex-wrap:wrap}.actions button{border:0;border-radius:9px;padding:11px 14px;background:#e7f3f8;font-size:12px;font-weight:900}.actions .primary{background:var(--ink);color:#fff}.actions .download{background:var(--sky)}.message{min-height:18px;margin:10px 2px 0;color:#3e7d9b;font-size:11px;font-weight:700;text-align:right}
    .preview{position:sticky;top:18px}.preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.preview-head small{color:#708793;font-size:10px;font-weight:900}.preview-head h2{margin:3px 0 0;font-size:17px}.size{padding:6px 8px;border-radius:6px;background:#edf6fa;color:#577486;font-size:10px;font-weight:800}.canvas-wrap{width:min(430px,100%);margin:auto;padding:10px;background:#dcecf4;border-radius:10px}.canvas-wrap canvas{display:block;width:100%;height:auto;background:#f6fbfe}.preview-note{margin:10px 0 0;color:#78909c;font-size:10px;text-align:center}
    dialog{width:min(560px,calc(100% - 30px));border:0;border-radius:16px;padding:0;box-shadow:0 24px 80px #17394c55}dialog::backdrop{background:#18344666}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:19px}.modal-head button{border:0;background:none;font-size:22px}.add-class{display:grid;grid-template-columns:110px 1fr auto;gap:7px;padding:16px 20px}.add-class input{min-width:0;padding:10px;border:1px solid #cbdde6;border-radius:8px}.add-class button{border:0;border-radius:8px;padding:0 14px;background:var(--sky);font-weight:900}.class-list{max-height:360px;overflow:auto;padding:0 20px 20px;display:grid;gap:6px}.class-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#f4f9fb;border-radius:8px;font-size:12px;font-weight:800}.class-item button{border:0;border-radius:6px;padding:6px 8px;background:#fff0f0;color:#ad4848;font-size:10px;font-weight:900}.backup-note{padding:0 20px 18px;color:#718895;font-size:10px;line-height:1.5}
    .file-input{display:none}
    @media(max-width:1150px){.workspace{grid-template-columns:1fr}.preview{position:static}.canvas-wrap{width:min(500px,100%)}}
    @media(max-width:760px){.top{padding:20px 14px}.top-inner{align-items:start;flex-direction:column}.brand h1{font-size:25px}.toolbar{margin:12px 12px 0;align-items:stretch;flex-direction:column}.toolbar label:first-child{min-width:0}.status{margin-left:0;align-self:flex-start}.workspace{margin:12px 12px 30px}.panel{padding:12px}.head-inputs{grid-template-columns:1fr}.labels{display:none}.day-row{grid-template-columns:52px 1fr}.day-row textarea:nth-of-type(2),.day-row textarea:nth-of-type(3){grid-column:2}.actions button{flex:1;min-width:130px}.add-class{grid-template-columns:90px 1fr}.add-class button{grid-column:1/-1;height:38px}}
  </style>
</head>
<body>
  <header class="top"><div class="top-inner"><div class="brand"><small>MVP WEEKLY</small><h1>주간 숙제표 제작기</h1></div><div class="utility"><button id="exportBackup">자료 백업</button><button id="importBackup">백업 복원</button><input class="file-input" id="backupFile" type="file" accept="application/json"></div></div></header>
  <section class="toolbar">
    <label>반<select id="course"></select></label>
    <label>주 시작일<input id="weekStart" type="date"></label>
    <button id="previous">지난주 불러오기</button>
    <button class="manage" id="manageCourses">반 추가·삭제</button>
    <span class="status" id="status">자동 저장 준비</span>
  </section>
  <main class="workspace">
    <section class="panel editor">
      <div class="head-inputs"><label>응원 문구<input id="title" value="조금씩 해도, 매일이면 충분해."></label><label>이번 주 꼭 기억하기<input id="notice" value="숙제는 채점하고 틀린 문제까지 고쳐오기"></label></div>
      <div class="labels"><span>요일</span><span>숙제</span><span>수업 진도</span><span>전달사항</span></div>
      <div class="rows" id="rows"></div>
      <div class="actions"><button id="save">저장</button><button class="primary" id="saveDownload">저장 + PNG</button><button class="download" id="download">PNG만 저장</button></div>
      <p class="message" id="message"></p>
    </section>
    <aside class="panel preview"><div class="preview-head"><div><small>학생에게 보이는 모습</small><h2>배포용 이미지 미리보기</h2></div><span class="size">1080 × 1350</span></div><div class="canvas-wrap"><canvas id="poster" width="1080" height="1350"></canvas></div><p class="preview-note">미리보기는 축소 표시됩니다. PNG는 원본 규격으로 저장됩니다.</p></aside>
  </main>
  <dialog id="courseDialog"><div class="modal-head"><h2>반 관리</h2><button id="closeDialog" aria-label="닫기">×</button></div><form class="add-class" id="classForm"><input id="newGrade" placeholder="학년 예: 중2" required><input id="newName" placeholder="반 이름" required><button>반 추가</button></form><div class="class-list" id="classList"></div><p class="backup-note">반을 삭제해도 기존 주간 기록은 백업 자료에 남습니다. 컴퓨터를 바꾸거나 브라우저 기록을 삭제하기 전에는 상단의 ‘자료 백업’을 눌러주세요.</p></dialog>
  <script>
    const DAYS=["월","화","수","목","금","토","일"], STORAGE="mvp-weekly-static-v1";
    const DEFAULT_COURSES=[
      ["중2","중등 전체 복습"],["중1","중1 1학기 복습"],["중3","공통수학1 경우의 수"],["중3","공통수학1 연립방정식"],["중3","고1 3월 모의고사"],["중3","중3-2"],["고2","토일 10시 미적분1"],["고2","토일 12시 확률과 통계"],["고2","확률과 통계·미적분2"],["고2","미적분1"],["고1","공통수학2 응용"],["고3","수능 확률과 통계"],["중2","중2-2"]
    ].map((x,i)=>({id:`course-${i+1}`,grade:x[0],name:x[1]}));
    const $=id=>document.getElementById(id), els={course:$("course"),week:$("weekStart"),title:$("title"),notice:$("notice"),rows:$("rows"),poster:$("poster"),status:$("status"),message:$("message")};
    let db=loadDB(), currentRows=[];
    function loadDB(){try{const v=JSON.parse(localStorage.getItem(STORAGE));if(v&&Array.isArray(v.courses)&&v.plans)return v}catch(e){}return{courses:DEFAULT_COURSES,plans:{}}}
    function persist(){localStorage.setItem(STORAGE,JSON.stringify(db));els.status.textContent="브라우저에 저장됨"}
    function monday(){const d=new Date(),n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);return localDate(d)}
    function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
    function dateAt(i){const d=new Date(els.week.value+"T12:00:00");d.setDate(d.getDate()+i);return d}
    function shortDate(d){return `${d.getMonth()+1}/${d.getDate()}`}
    function key(){return `${els.course.value}|${els.week.value}`}
    function blankRows(){return DAYS.map(()=>({homework:"",progress:"",note:""}))}
    function courseName(){const c=db.courses.find(x=>x.id===els.course.value);return c?`${c.grade} ${c.name}`:"반 미선택"}
    function renderCourses(){const selected=els.course.value;els.course.innerHTML=db.courses.map(c=>`<option value="${escapeHtml(c.id)}">${escapeHtml(c.grade)} ${escapeHtml(c.name)}</option>`).join("");if(db.courses.some(c=>c.id===selected))els.course.value=selected;renderClassList()}
    function renderClassList(){$("classList").innerHTML=db.courses.map(c=>`<div class="class-item"><span>${escapeHtml(c.grade)} ${escapeHtml(c.name)}</span><button data-delete="${escapeHtml(c.id)}">삭제</button></div>`).join("")||'<div class="class-item">등록된 반이 없습니다.</div>'}
    function renderRows(){els.rows.innerHTML=DAYS.map((d,i)=>`<div class="day-row"><span class="day ${i>4?"weekend":""}"><b>${d}</b><small>${shortDate(dateAt(i))}</small></span><textarea data-i="${i}" data-k="homework" placeholder="교재와 문제 범위">${escapeHtml(currentRows[i].homework)}</textarea><textarea data-i="${i}" data-k="progress" placeholder="수업 진도">${escapeHtml(currentRows[i].progress)}</textarea><textarea data-i="${i}" data-k="note" placeholder="추가 안내">${escapeHtml(currentRows[i].note)}</textarea></div>`).join("")}
    function loadPlan(){const p=db.plans[key()];els.title.value=p?.title||"조금씩 해도, 매일이면 충분해.";els.notice.value=p?.notice||"숙제는 채점하고 틀린 문제까지 고쳐오기";currentRows=p?.rows?.map(x=>({...x}))||blankRows();renderRows();renderPoster();els.status.textContent=p?"저장된 기록 불러옴":"새 주간표"}
    function savePlan(show=true){if(!els.course.value)return;db.plans[key()]={courseId:els.course.value,weekStart:els.week.value,title:els.title.value,notice:els.notice.value,rows:currentRows,updatedAt:new Date().toISOString()};persist();if(show)tell("현재 주간표를 저장했습니다.")}
    function tell(t){els.message.textContent=t;clearTimeout(tell.timer);tell.timer=setTimeout(()=>els.message.textContent="",3000)}
    function escapeHtml(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
    function rounded(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
    function fitText(ctx,text,maxWidth,start,min=20,weight=800){let size=start;do{ctx.font=`${weight} ${size}px "Malgun Gothic",sans-serif`;if(ctx.measureText(text).width<=maxWidth)return size;size-=1}while(size>=min);return min}
    function wrap(ctx,text,maxWidth,maxLines){const words=String(text||"").split(/\s+/),lines=[];let line="";for(const word of words){const test=line?line+" "+word:word;if(ctx.measureText(test).width<=maxWidth)line=test;else{if(line)lines.push(line);line=word;if(lines.length===maxLines-1)break}}if(line&&lines.length<maxLines)lines.push(line);if(lines.length===maxLines&&words.join(" ").length>lines.join(" ").length){while(ctx.measureText(lines[maxLines-1]+"…").width>maxWidth)lines[maxLines-1]=lines[maxLines-1].slice(0,-1);lines[maxLines-1]+="…"}return lines}
    function renderPoster(){const c=els.poster,ctx=c.getContext("2d"),W=1080,H=1350;ctx.clearRect(0,0,W,H);ctx.fillStyle="#f6fbfe";ctx.fillRect(0,0,W,H);const x=60,w=960;ctx.fillStyle="#5a8ca5";ctx.font='700 16px Arial';ctx.fillText("MVP MATH ACADEMY",x,62);rounded(ctx,812,34,208,48,9,"#24364b");ctx.fillStyle="#fff";ctx.font='900 15px Arial';ctx.textAlign="center";ctx.fillText("WEEKLY PLAN",916,64);ctx.textAlign="left";ctx.fillStyle="#69bdea";ctx.fillRect(x,92,w,4);
      ctx.fillStyle="#3f7896";ctx.font='800 17px "Malgun Gothic",sans-serif';ctx.fillText("이번 주도 차근차근",x,132);const title=els.title.value||"조금씩 해도, 매일이면 충분해.";fitText(ctx,title,940,42,26,800);ctx.fillStyle="#24364b";ctx.fillText(title,x,183);
      rounded(ctx,x,212,w,68,12,"#dff3fc");ctx.fillStyle="#24364b";ctx.font='900 22px "Malgun Gothic",sans-serif';ctx.fillText(courseName(),x+24,254);ctx.textAlign="right";ctx.font='700 16px "Malgun Gothic",sans-serif';ctx.fillStyle="#526d7c";ctx.fillText(`${shortDate(dateAt(0))}(월) - ${shortDate(dateAt(6))}(일)`,x+w-22,253);ctx.textAlign="left";
      rounded(ctx,x,298,w,60,11,"#fff","#d5e6ef");rounded(ctx,x+18,312,76,32,6,"#ffd54a");ctx.fillStyle="#24364b";ctx.font='900 13px Arial';ctx.fillText("CHECK!",x+29,333);ctx.font='800 17px "Malgun Gothic",sans-serif';ctx.fillText(els.notice.value||"이번 주 안내사항을 확인해주세요.",x+112,335);
      const startY=378,rowH=118,gap=9,dayW=105;currentRows.forEach((row,i)=>{const y=startY+i*(rowH+gap);rounded(ctx,x,y,dayW,rowH,12,i>4?"#ffd54a":"#69bdea");ctx.textAlign="center";ctx.fillStyle="#18384b";ctx.font='900 32px "Malgun Gothic",sans-serif';ctx.fillText(DAYS[i],x+dayW/2,y+53);ctx.font='800 14px Arial';ctx.fillText(shortDate(dateAt(i)),x+dayW/2,y+82);ctx.textAlign="left";rounded(ctx,x+dayW+10,y,w-dayW-10,rowH,12,"#fff","#d5e6ef");const task=row.homework||"숙제 없음";ctx.fillStyle="#24364b";ctx.font=`900 ${task.length>48?17:20}px "Malgun Gothic",sans-serif`;const lines=wrap(ctx,task,w-dayW-52,2);lines.forEach((line,n)=>ctx.fillText(line,x+dayW+30,y+34+n*25));ctx.strokeStyle="#e4eef3";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+dayW+30,y+72);ctx.lineTo(x+w-20,y+72);ctx.stroke();ctx.font='700 13px "Malgun Gothic",sans-serif';ctx.fillStyle="#6f8794";const meta=[];if(row.progress)meta.push(`진도  ${row.progress}`);if(row.note)meta.push(`메모  ${row.note}`);ctx.fillText(meta.join("    |    ")||"차근차근 완료하고 체크하기",x+dayW+30,y+98)});
      const fy=1286;ctx.strokeStyle="#cfe3ed";ctx.beginPath();ctx.moveTo(x,fy);ctx.lineTo(x+w,fy);ctx.stroke();ctx.fillStyle="#d2a900";ctx.font='900 16px "Malgun Gothic",sans-serif';ctx.fillText("성실은 조용하지만 멀리 간다.",x,1322);ctx.textAlign="right";ctx.fillStyle="#24364b";ctx.font='900 17px "Malgun Gothic",sans-serif';ctx.fillText("MVP 수학학원",x+w,1322);ctx.textAlign="left"}
    function downloadPNG(){renderPoster();const a=document.createElement("a");a.download=`${els.week.value}_${courseName().replace(/[\\/:*?"<>|\s]+/g,"_")}_주간숙제표.png`;a.href=els.poster.toDataURL("image/png");a.click();tell("1080×1350 PNG를 저장했습니다.")}
    els.week.value=monday();renderCourses();loadPlan();
    els.rows.addEventListener("input",e=>{const t=e.target;if(!t.dataset.k)return;currentRows[+t.dataset.i][t.dataset.k]=t.value;renderPoster();els.status.textContent="수정 중"});[els.title,els.notice].forEach(el=>el.addEventListener("input",()=>{renderPoster();els.status.textContent="수정 중"}));els.course.addEventListener("change",loadPlan);els.week.addEventListener("change",loadPlan);
    $("save").onclick=()=>savePlan();$("download").onclick=downloadPNG;$("saveDownload").onclick=()=>{savePlan(false);downloadPNG()};
    $("previous").onclick=()=>{const d=new Date(els.week.value+"T12:00:00");d.setDate(d.getDate()-7);const p=db.plans[`${els.course.value}|${localDate(d)}`];if(!p)return tell("지난주에 저장된 내용이 없습니다.");els.title.value=p.title;els.notice.value=p.notice;currentRows=p.rows.map(x=>({...x}));renderRows();renderPoster();els.status.textContent="지난주 내용 복사됨";tell("지난주 내용을 불러왔습니다. 확인 후 저장해주세요.")};
    $("manageCourses").onclick=()=>$("courseDialog").showModal();$("closeDialog").onclick=()=>$("courseDialog").close();$("classForm").onsubmit=e=>{e.preventDefault();const c={id:`course-${Date.now()}`,grade:$("newGrade").value.trim(),name:$("newName").value.trim()};db.courses.push(c);persist();renderCourses();els.course.value=c.id;$("classForm").reset();loadPlan()};$("classList").onclick=e=>{const id=e.target.dataset.delete;if(!id)return;if(!confirm("이 반을 목록에서 삭제할까요?"))return;db.courses=db.courses.filter(c=>c.id!==id);persist();renderCourses();loadPlan()};
    $("exportBackup").onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`MVP_숙제표_백업_${localDate(new Date())}.json`;a.click();URL.revokeObjectURL(a.href)};$("importBackup").onclick=()=>$("backupFile").click();$("backupFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const next=JSON.parse(await f.text());if(!Array.isArray(next.courses)||!next.plans)throw Error();if(!confirm("현재 브라우저 자료를 백업 파일로 교체할까요?"))return;db=next;persist();renderCourses();loadPlan();tell("백업 자료를 복원했습니다.")}catch(err){alert("올바른 MVP 백업 파일이 아닙니다.")}e.target.value=""};
    window.addEventListener("beforeunload",()=>savePlan(false));
  </script>
</body>
</html>
